schema_version: prc.adapter-manifest/v0.3
id: prc.adapter.fixture@0.1
title: Protocol fixture adapter
description: Produces bounded fixture observations for protocol and runner tests.
publisher:
  id: prc-project
  name: Production Readiness Checklist
owner: scanner-maintainers
maintenance: active
protocol: prc-adapter-jsonl-v1
output_schema: prc.adapter-message/v0.1
observation_kinds: [fixture-result]
compatibility:
  engine_apis: [prc.engine/v0.1]
tool:
  name: prc-fixture
  version: 1.0.0
  upstream: https://example.com/prc-fixture
  formats:
    - name: fixture-json
      versions: ["1.0"]
limitations:
  - This adapter is a protocol fixture and does not inspect production projects.
runner: oci
image: registry.example/prc/fixture@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
command: [/adapter, scan]
capabilities:
  read_workspace: true
  write_scratch: true
  network: deny
  network_hosts: []
  secret_handles: []
  child_processes: false
resources:
  timeout_seconds: 60
  memory_mb: 512
  cpus: 1
  pids: 64
  tmpfs_mb: 64
  max_line_bytes: 262144
  max_messages: 10000
  max_stdin_bytes: 1048576
  max_stdout_bytes: 4194304
  max_stderr_bytes: 65536
