<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Everylast</title>
  <desc id="desc">Know what's left before you ship. An open-source scanner with 10,042 production-readiness controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="35" r="235" fill="#fff" opacity=".03"/>
  <circle cx="1090" cy="630" r="215" fill="#5eead4" opacity=".065"/>
  <circle cx="60" cy="600" r="225" fill="#818cf8" opacity=".07"/>
  <path d="M0 525C250 452 420 570 650 520s402-74 630-7v127H0Z" fill="#020617" opacity=".16"/>
  <g transform="translate(76 155)" filter="url(#shadow)">
    <rect width="300" height="230" rx="56" fill="#111827" stroke="#8b5cf6" stroke-width="5"/>
    <path d="M48 115h154" fill="none" stroke="url(#trail)" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    <g fill="#e0e7ff">
      <circle cx="56" cy="115" r="12"/>
      <circle cx="94" cy="115" r="12"/>
      <circle cx="132" cy="115" r="12"/>
      <circle cx="170" cy="115" r="12"/>
      <circle cx="208" cy="115" r="12"/>
    </g>
    <path d="m222 119 19 19 40-51" fill="none" stroke="#5eead4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="438" y="175" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="760" letter-spacing="3.5">OPEN-SOURCE PROJECT SCANNER</text>
  <text x="430" y="280" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="90" font-weight="840" letter-spacing="-3">Everylast</text>
  <text x="438" y="340" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="520">Know what's left before you ship.</text>
  <g transform="translate(438 390)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="720">
    <rect width="180" height="48" rx="24" fill="#fff" opacity=".12"/>
    <text x="25" y="31" fill="#e0e7ff">10,042 controls</text>
    <rect x="196" width="222" height="48" rx="24" fill="#fff" opacity=".12"/>
    <text x="221" y="31" fill="#ccfbf1">scan-only by default</text>
    <rect x="434" width="190" height="48" rx="24" fill="#fff" opacity=".12"/>
    <text x="459" y="31" fill="#e0e7ff">Codex + Claude</text>
  </g>
  <text x="438" y="535" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">github.com/MarinJursic/production-readiness-checklist</text>
