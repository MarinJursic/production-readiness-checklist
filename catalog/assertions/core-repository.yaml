  - id: PRC-A-CORE-008
    revision: 1
    control_ids: [USEQ-F4D6E3B3]
    title: GitHub Actions use immutable references
    statement: Every external GitHub Action is pinned to a full commit SHA.
    applicability: inventory.ci.github_actions == true
