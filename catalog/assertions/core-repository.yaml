        description: A nonempty root license file from the scanned commit.
    implementation_id: prc.native.file-present@0.1
    parameters:
      paths: [LICENSE, LICENSE.md, LICENSE.txt, COPYING]
      minimum_bytes: 1
    severity: medium
    gate: required
    remediation_class: R0
  - id: PRC-A-CORE-003
    revision: 1
