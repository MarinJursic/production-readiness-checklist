      allow_local_actions: true
    severity: high
    gate: required
    remediation_class: R2
  - id: PRC-A-CORE-009
    revision: 1
    control_ids: [USEQ-12655775]
    title: Continuous integration is configured
    statement: The repository contains a supported continuous-integration configuration.
    applicability: "true"
