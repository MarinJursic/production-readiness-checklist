name: Release scanner

on:
  push:
    tags:
      - "scanner-v*"

permissions:
  contents: read

concurrency:
  group: scanner-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      built_at: ${{ steps.metadata.outputs.built_at }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out the exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate release identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          if [[ "$tag" != scanner-v* ]]; then
            echo "invalid scanner release tag: $tag" >&2
            exit 1
          fi
          version=${tag#scanner-v}
          if [[ ${#version} -gt 128 ]] || ! python -c \
            'import sys; from scripts.build_release import SEMVER; raise SystemExit(0 if SEMVER.fullmatch(sys.argv[1]) else 1)' \
            "$version"; then
            echo "invalid scanner semantic version: $version" >&2
            exit 1
          fi
          tagged_commit=$(git rev-list -n 1 "$tag")
          if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "tag does not resolve to the checked-out commit" >&2
            exit 1
          fi
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          built_at=$(date -u -d "@$source_epoch" +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release source
        run: |
          go mod verify
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
          go test -race ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -include=G703,G122 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Exercise pinned production Gitleaks adapter
        env:
          PRC_TEST_GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          docker pull "$PRC_TEST_GITLEAKS_IMAGE"
          go test -race ./scanner/adapter \
            -run '^TestLiveGitleaksOCIUsesPinnedRulesAndIgnoresTargetSuppressions$' \
            -count=1

      - name: Exercise pinned production Syft adapter
        env:
          PRC_TEST_SYFT_IMAGE: ghcr.io/anchore/syft@sha256:d2dc3ec86cb2b4e7ddb226ba0305c4523b7c0694c45d9f576b42b4c2f5ce7aa8
        run: |
          docker pull "$PRC_TEST_SYFT_IMAGE"
          go test -race ./scanner/adapter \
            -run '^TestLiveSyftOCIProducesDeterministicCycloneDXDespiteTargetConfig$' \
            -count=1

      - name: Exercise pinned production Checkov adapter
        env:
          PRC_TEST_CHECKOV_IMAGE: docker.io/bridgecrew/checkov@sha256:c64ffb6d6fc8087c896341a2c697770a04a1cf558db04fa7b8129d8ca6bce336
        run: |
          docker pull "$PRC_TEST_CHECKOV_IMAGE"
          go test -race ./scanner/adapter \
            -run '^TestLiveCheckovOCIUsesPinnedOfflinePolicyAndRejectsSuppressions$' \
            -count=1

      - name: Install schema validation dependencies
        run: |
          pip install -r requirements-dev.lock.txt
          pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-dev.lock.txt
          python -m pip_audit -r requirements-docs.lock.txt

      - name: Validate catalog and release tooling
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -p "test_*.py" -v
          python scripts/catalog.py check

      - name: Generate deterministic CycloneDX SBOM input
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            mod -json -noserial -notimestamp -short-purls \
            -output "$RUNNER_TEMP/everylast.cdx.json" .

      - name: Build release twice and compare
        env:
          EVERYLAST_VERSION: ${{ steps.metadata.outputs.version }}
          EVERYLAST_BUILT_AT: ${{ steps.metadata.outputs.built_at }}
        run: |
          python scripts/build_release.py \
            --version "$EVERYLAST_VERSION" \
            --commit "$GITHUB_SHA" \
            --built-at "$EVERYLAST_BUILT_AT" \
            --sbom "$RUNNER_TEMP/everylast.cdx.json" \
            --output "$RUNNER_TEMP/release-first"
          python scripts/build_release.py \
            --version "$EVERYLAST_VERSION" \
            --commit "$GITHUB_SHA" \
            --built-at "$EVERYLAST_BUILT_AT" \
            --sbom "$RUNNER_TEMP/everylast.cdx.json" \
            --output "$RUNNER_TEMP/release-second"
          diff --recursive --no-dereference "$RUNNER_TEMP/release-first" "$RUNNER_TEMP/release-second"
          mkdir "$RUNNER_TEMP/self-scan"
          tar -xzf "$RUNNER_TEMP/release-first/everylast_${EVERYLAST_VERSION}_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP/self-scan"
          release_root="$RUNNER_TEMP/self-scan/everylast_${EVERYLAST_VERSION}_linux_amd64"
          "$release_root/everylast" scan \
            --target . \
            --catalog-root "$release_root" \
            --format json \
            --no-report \
            --exit-policy never \
            > "$RUNNER_TEMP/release-first/everylast_${EVERYLAST_VERSION}_self-scan.json"
          python scripts/validate_instance.py run-result.schema.json \
            "$RUNNER_TEMP/release-first/everylast_${EVERYLAST_VERSION}_self-scan.json"
          python -c 'import json,os,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["inventory"]["git_commit"]==os.environ["GITHUB_SHA"] and d["plan"]["target_commit"]==os.environ["GITHUB_SHA"] and len(d["control_results"])==10042' \
            "$RUNNER_TEMP/release-first/everylast_${EVERYLAST_VERSION}_self-scan.json"
          python -c 'import pathlib,sys; from scripts.build_release import write_checksums; write_checksums(pathlib.Path(sys.argv[1]))' \
            "$RUNNER_TEMP/release-first"
          mv "$RUNNER_TEMP/release-first" release

      - name: Verify release contracts and checksums
        env:
          EVERYLAST_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python scripts/validate_instance.py \
            release-manifest.schema.json \
            "release/everylast_${EVERYLAST_VERSION}_release-manifest.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["bomFormat"]=="CycloneDX" and d["specVersion"]=="1.6" and "serialNumber" not in d and "timestamp" not in d["metadata"]' \
            "release/everylast_${EVERYLAST_VERSION}.cdx.json"
          python scripts/validate_instance.py run-result.schema.json \
            "release/everylast_${EVERYLAST_VERSION}_self-scan.json"
          (cd release && sha256sum --check SHA256SUMS)

      - name: Upload exact release for native smoke tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: everylast-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  smoke:
    needs: build
    name: Smoke ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
          - name: Windows arm64
            runner: windows-11-arm
    steps:
      - name: Check out release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the exact release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: everylast-release-${{ github.sha }}
          path: release

      - name: Run native archive and npm launcher
        run: >-
          python scripts/smoke_release.py
          --release release
          --version "${{ needs.build.outputs.version }}"
          --commit "${{ github.sha }}"

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download the exact tested release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: everylast-release-${{ github.sha }}
          path: release

      - name: Recheck release checksums
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          python scripts/validate_instance.py release-manifest.schema.json \
            "release/everylast_${{ needs.build.outputs.version }}_release-manifest.json"

      - name: Prepare SBOM attestation subjects
        run: |
          awk '$2 ~ /\.(tar\.gz|zip|tgz)$/ {print}' release/SHA256SUMS \
            > "$RUNNER_TEMP/release-archive-checksums"
          test -s "$RUNNER_TEMP/release-archive-checksums"

      - name: Attest SLSA build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: release/SHA256SUMS

      - name: Attest CycloneDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ${{ runner.temp }}/release-archive-checksums
          sbom-path: release/everylast_${{ needs.build.outputs.version }}.cdx.json

      - name: Publish npm packages with trusted publishing
        run: >-
          python scripts/publish_npm.py
          --release release
          --manifest "release/everylast_${{ needs.build.outputs.version }}_release-manifest.json"
          --version "${{ needs.build.outputs.version }}"

      - name: Publish scanner release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Everylast ${{ needs.build.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease }}
