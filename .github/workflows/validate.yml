name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for the npm launcher contract
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install catalog dependencies
        run: pip install -r requirements-dev.lock.txt

      - name: Audit pinned Python dependencies
        run: |
          pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-dev.lock.txt
          python -m pip_audit -r requirements-docs.lock.txt

      - name: Validate control IDs and links
        run: python scripts/validate.py

      - name: Run validator tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Test the dependency-free npm launcher
        run: |
          node --test npm/prc/test/*.test.mjs
          node --check npm/prc/bin/prc.js
          npm pack ./npm/prc --ignore-scripts --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8"))[0]; assert {x["path"] for x in p["files"]}=={"LICENSE","README.md","bin/prc.js","package.json","platforms.json"}' "$RUNNER_TEMP/npm-pack.json"

      - name: Check catalog schemas and generated files
        run: python scripts/catalog.py check

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"

  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install schema validation dependencies
        run: pip install -r requirements-dev.lock.txt

      - name: Verify Go modules
        run: go mod verify

      - name: Audit reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Run scanner tests with the race detector
        run: go test -race ./...

      - name: Exercise pinned production Gitleaks adapter
        env:
          PRC_TEST_GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          docker pull "$PRC_TEST_GITLEAKS_IMAGE"
          go test -race ./scanner/adapter \
            -run '^TestLiveGitleaksOCIUsesPinnedRulesAndIgnoresTargetSuppressions$' \
            -count=1

      - name: Exercise pinned production Syft adapter
        env:
          PRC_TEST_SYFT_IMAGE: ghcr.io/anchore/syft@sha256:d2dc3ec86cb2b4e7ddb226ba0305c4523b7c0694c45d9f576b42b4c2f5ce7aa8
        run: |
          docker pull "$PRC_TEST_SYFT_IMAGE"
          go test -race ./scanner/adapter \
            -run '^TestLiveSyftOCIProducesDeterministicCycloneDXDespiteTargetConfig$' \
            -count=1

      - name: Exercise pinned production Checkov adapter
        env:
          PRC_TEST_CHECKOV_IMAGE: docker.io/bridgecrew/checkov@sha256:c64ffb6d6fc8087c896341a2c697770a04a1cf558db04fa7b8129d8ca6bce336
        run: |
          docker pull "$PRC_TEST_CHECKOV_IMAGE"
          go test -race ./scanner/adapter \
            -run '^TestLiveCheckovOCIUsesPinnedOfflinePolicyAndRejectsSuppressions$' \
            -count=1

      - name: Vet scanner
        run: go vet ./...

      - name: Run static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Reject path traversal and filesystem walk races
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -include=G703,G122 ./...

      - name: Build scanner
        run: go build -trimpath -o "$RUNNER_TEMP/prc" ./cmd/prc

      - name: Exercise adapter protocol fixtures
        run: |
          "$RUNNER_TEMP/prc" adapter fixture-validate \
            --suite fixtures/adapters/fixture-suite.yaml \
            --format json > "$RUNNER_TEMP/adapter-fixture-report.json"
          "$RUNNER_TEMP/prc" adapter validate-output \
            --manifest fixtures/adapters/fixture-adapter.yaml \
            --file fixtures/adapters/valid-output.jsonl
          if "$RUNNER_TEMP/prc" adapter validate-output \
            --manifest fixtures/adapters/fixture-adapter.yaml \
            --file fixtures/adapters/malicious-authority-output.jsonl; then
            echo "malicious adapter fixture was accepted" >&2
            exit 1
          fi

      - name: Exercise provider protocol fixtures
        run: |
          "$RUNNER_TEMP/prc" provider capabilities --provider codex
          "$RUNNER_TEMP/prc" provider capabilities --provider claude
          "$RUNNER_TEMP/prc" provider validate-output \
            --provider codex \
            --task fixtures/providers/suggest-task.json \
            --file fixtures/providers/valid-output.json
          "$RUNNER_TEMP/prc" provider validate-output \
            --provider claude \
            --task fixtures/providers/suggest-task.json \
            --file fixtures/providers/valid-claude-envelope.json
          "$RUNNER_TEMP/prc" provider seal-task \
            --file fixtures/providers/suggest-task.json \
            --workspace fixtures/providers/workspace \
            --config fixtures/config/production-readiness.yaml \
            > "$RUNNER_TEMP/configured-provider-task.json"
          if "$RUNNER_TEMP/prc" provider validate-output \
            --provider codex \
            --task fixtures/providers/suggest-task.json \
            --file fixtures/providers/malicious-capability-output.json; then
            echo "malicious provider fixture was accepted" >&2
            exit 1
          fi

      - name: Exercise read-only MCP stdio server
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"prc_explain","arguments":{"assertion_id":"PRC-A-CORE-001"}}}' \
            > "$RUNNER_TEMP/mcp-input.jsonl"
          "$RUNNER_TEMP/prc" mcp serve \
            --catalog-root . \
            --target . \
            --profile prc/core-repository \
            < "$RUNNER_TEMP/mcp-input.jsonl" \
            > "$RUNNER_TEMP/mcp-output.jsonl"
          python -c 'import json,jsonschema,sys; rows=[json.loads(line) for line in open(sys.argv[1], encoding="utf-8")]; assert len(rows)==3; tools=rows[1]["result"]["tools"]; assert [tool["name"] for tool in tools]==["prc_plan","prc_scan","prc_explain"]; assert all(tool["annotations"]["readOnlyHint"] and not tool["annotations"]["openWorldHint"] for tool in tools); result=rows[2]["result"]; assert result["structuredContent"]["assertion"]["id"]=="PRC-A-CORE-001"; assert result["content"][0]["text"]==json.dumps(result["structuredContent"], separators=(",", ":")); jsonschema.validate(result["structuredContent"], tools[2]["outputSchema"])' "$RUNNER_TEMP/mcp-output.jsonl"

      - name: Generate scanner outputs
        run: |
          mkdir "$RUNNER_TEMP/doctor-state" "$RUNNER_TEMP/doctor-candidates"
          chmod 0700 "$RUNNER_TEMP/doctor-state"
          "$RUNNER_TEMP/prc" doctor \
            --target . \
            --catalog-root . \
            --state-dir "$RUNNER_TEMP/doctor-state" \
            --candidate-parent "$RUNNER_TEMP/doctor-candidates" \
            --format json > "$RUNNER_TEMP/doctor.json"
          "$RUNNER_TEMP/prc" config validate \
            --file fixtures/config/production-readiness.yaml \
            --format json > "$RUNNER_TEMP/config-validation.json"
          "$RUNNER_TEMP/prc" catalog validate --catalog-root . --format json > "$RUNNER_TEMP/catalog-manifest.json"
          "$RUNNER_TEMP/prc" catalog bundle --catalog-root . > "$RUNNER_TEMP/catalog-bundle.json"
          "$RUNNER_TEMP/prc" benchmark run --catalog-root . --suite fixtures/benchmarks/core-native/suite.yaml --evaluated-at 2026-08-23T12:00:00Z --format json > "$RUNNER_TEMP/benchmark-report.json"
          "$RUNNER_TEMP/prc" benchmark run --catalog-root . --suite fixtures/benchmarks/core-native/suite-comprehensive.yaml --evaluated-at 2026-08-23T12:00:00Z --format json > "$RUNNER_TEMP/comprehensive-benchmark-report.json"
          "$RUNNER_TEMP/prc" pack validate --catalog-root . --file packs/core-foundation.yaml --format json > "$RUNNER_TEMP/pack-report.json"
          "$RUNNER_TEMP/prc" pack validate --catalog-root . --file packs/core-native.yaml --format json > "$RUNNER_TEMP/core-native-pack-report.json"
          "$RUNNER_TEMP/prc" inventory --target . --format json > "$RUNNER_TEMP/inventory.json"
          "$RUNNER_TEMP/prc" plan --target . --catalog-root . --format json > "$RUNNER_TEMP/plan.json"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --state-dir "$RUNNER_TEMP/state" --format json --exit-policy never > "$RUNNER_TEMP/run.json"
          "$RUNNER_TEMP/prc" plan --target . --catalog-root . --profile prc/api --format json > "$RUNNER_TEMP/api-plan.json"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --profile prc/api --format json --exit-policy never > "$RUNNER_TEMP/api-run.json"
          "$RUNNER_TEMP/prc" plan --target . --catalog-root . --profile prc/kubernetes --format json > "$RUNNER_TEMP/kubernetes-plan.json"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --profile prc/kubernetes --format json --exit-policy never > "$RUNNER_TEMP/kubernetes-run.json"
          "$RUNNER_TEMP/prc" scan \
            --target . \
            --catalog-root . \
            --profile prc/supply-chain \
            --mode verify-local \
            --adapter-manifest adapters/syft-v1.51.0.yaml \
            --state-dir "$RUNNER_TEMP/supply-state" \
            --format json \
            --exit-policy never \
            > "$RUNNER_TEMP/supply-run.json"
          python -c 'import hashlib,json,pathlib,sys; run=json.load(open(sys.argv[1], encoding="utf-8")); result=next(x for x in run["results"] if x["assertion_id"]=="PRC-A-SUPPLY-001"); assert result["assessment"]=="pass"; execution=next(x for x in run["adapter_executions"] if x["adapter_id"]=="prc.adapter.syft@1.51"); artifact=execution["transcript"]["artifacts"][0]; digest=artifact["digest"].removeprefix("sha256:"); path=pathlib.Path(sys.argv[2])/"artifacts"/"sha256"/digest[:2]/digest; payload=path.read_bytes(); assert len(payload)==artifact["size"] and hashlib.sha256(payload).hexdigest()==digest; bom=json.loads(payload); assert bom["bomFormat"]=="CycloneDX" and bom["specVersion"]=="1.7" and "serialNumber" not in bom' "$RUNNER_TEMP/supply-run.json" "$RUNNER_TEMP/supply-state"
          "$RUNNER_TEMP/prc" inventory --target . --config fixtures/config/production-readiness.yaml --format json > "$RUNNER_TEMP/configured-inventory.json"
          "$RUNNER_TEMP/prc" plan --target . --catalog-root . --config fixtures/config/production-readiness.yaml --format json > "$RUNNER_TEMP/configured-plan.json"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --config fixtures/config/production-readiness.yaml --state-dir "$RUNNER_TEMP/configured-state" --format json --exit-policy never > "$RUNNER_TEMP/configured-run.json"
          "$RUNNER_TEMP/prc" history list --state-dir "$RUNNER_TEMP/state" --format json > "$RUNNER_TEMP/history.json"
          "$RUNNER_TEMP/prc" history check --state-dir "$RUNNER_TEMP/state" --format json > "$RUNNER_TEMP/state-check.json"
          PRC_HISTORY_RUN_ID=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run_id"])' "$RUNNER_TEMP/run.json")
          "$RUNNER_TEMP/prc" history show --state-dir "$RUNNER_TEMP/state" --format json "$PRC_HISTORY_RUN_ID" > "$RUNNER_TEMP/historical-run.json"
          "$RUNNER_TEMP/prc" diff --state-dir "$RUNNER_TEMP/state" --base-run "$PRC_HISTORY_RUN_ID" --target . --catalog-root . --format json > "$RUNNER_TEMP/invalidation.json"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --format markdown --exit-policy never > "$RUNNER_TEMP/run.md"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --format html --exit-policy never > "$RUNNER_TEMP/run.html"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --format sarif --exit-policy never > "$RUNNER_TEMP/run.sarif"
          "$RUNNER_TEMP/prc" scan --target . --catalog-root . --format junit --exit-policy never > "$RUNNER_TEMP/run.xml"
          python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$RUNNER_TEMP/run.sarif"
          python -c 'import sys,xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$RUNNER_TEMP/run.xml"
          grep -q '<!doctype html>' "$RUNNER_TEMP/run.html"

      - name: Exercise isolated deterministic remediation
        run: |
          mkdir "$RUNNER_TEMP/remediation-target"
          printf "print('ready')" > "$RUNNER_TEMP/remediation-target/app.py"
          "$RUNNER_TEMP/prc" remediate \
            --target "$RUNNER_TEMP/remediation-target" \
            --catalog-root . \
            --candidate-dir "$RUNNER_TEMP/remediation-candidate" \
            --format json > "$RUNNER_TEMP/remediation.json"
          test "$(tail -c 1 "$RUNNER_TEMP/remediation-target/app.py")" = ")"

          mkdir "$RUNNER_TEMP/mode-target"
          printf "print('ready')\n" > "$RUNNER_TEMP/mode-target/app.py"
          chmod 0666 "$RUNNER_TEMP/mode-target/app.py"
          "$RUNNER_TEMP/prc" remediate \
            --target "$RUNNER_TEMP/mode-target" \
            --catalog-root . \
            --assertion PRC-A-CORE-022 \
            --candidate-dir "$RUNNER_TEMP/mode-candidate" \
            --format json > "$RUNNER_TEMP/mode-remediation.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/mode-target/app.py")" = "666"
          test "$(stat -c '%a' "$RUNNER_TEMP/mode-candidate/app.py")" = "644"

          mkdir "$RUNNER_TEMP/configured-remediation-target"
          cp fixtures/config/production-readiness.yaml "$RUNNER_TEMP/configured-remediation-target/production-readiness.yaml"
          printf "print('ready')" > "$RUNNER_TEMP/configured-remediation-target/app.py"
          "$RUNNER_TEMP/prc" remediate \
            --target "$RUNNER_TEMP/configured-remediation-target" \
            --catalog-root . \
            --config "$RUNNER_TEMP/configured-remediation-target/production-readiness.yaml" \
            --candidate-dir "$RUNNER_TEMP/configured-remediation-candidate" \
            --format json > "$RUNNER_TEMP/configured-remediation.json"

      - name: Exercise bounded deterministic remediation loop
        run: |
          mkdir "$RUNNER_TEMP/remediation-loop-target"
          printf "print('ready')" > "$RUNNER_TEMP/remediation-loop-target/app.py"
          chmod 0666 "$RUNNER_TEMP/remediation-loop-target/app.py"
          set +e
          "$RUNNER_TEMP/prc" fix \
            --target "$RUNNER_TEMP/remediation-loop-target" \
            --catalog-root . \
            --candidate-root "$RUNNER_TEMP/remediation-loop-candidates" \
            --format json > "$RUNNER_TEMP/remediation-run.json"
          status=$?
          set -e
          test "$status" -eq 1
          test "$(stat -c '%a' "$RUNNER_TEMP/remediation-loop-target/app.py")" = "666"
          test "$(stat -c '%a' "$RUNNER_TEMP/remediation-loop-candidates/attempt-002/app.py")" = "644"
          test "$(tail -c 1 "$RUNNER_TEMP/remediation-loop-target/app.py")" = ")"
          test "$(tail -c 1 "$RUNNER_TEMP/remediation-loop-candidates/attempt-002/app.py")" = ""

      - name: Exercise isolated provider-proposal remediation
        env:
          PRC_TEST_GO_VERIFIER_IMAGE: docker.io/library/golang@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc # golang:1.27.0-alpine
        run: |
          docker pull "$PRC_TEST_GO_VERIFIER_IMAGE"
          set +e
          "$RUNNER_TEMP/prc" remediate-proposal \
            --target fixtures/providers/workspace \
            --catalog-root . \
            --provider codex \
            --task fixtures/providers/suggest-task.json \
            --output fixtures/providers/valid-output.json \
            --candidate-dir "$RUNNER_TEMP/provider-candidate" \
            --verifier-image "$PRC_TEST_GO_VERIFIER_IMAGE" \
            --format json > "$RUNNER_TEMP/provider-remediation.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "$RUNNER_TEMP/provider-remediation.json"
            exit "$status"
          fi
          test ! -e fixtures/providers/workspace/app_test.go
          test -f "$RUNNER_TEMP/provider-candidate/app_test.go"
          (cd "$RUNNER_TEMP/provider-candidate" && go test ./...)

      - name: Validate scanner output schemas
        run: |
          python -c 'import json,sys,yaml; json.dump(yaml.safe_load(open(sys.argv[1], encoding="utf-8")), sys.stdout)' fixtures/config/production-readiness.yaml > "$RUNNER_TEMP/config.json"
          python -c 'import json,sys,yaml; json.dump(yaml.safe_load(open(sys.argv[1], encoding="utf-8")), sys.stdout)' fixtures/benchmarks/core-native/suite.yaml > "$RUNNER_TEMP/benchmark-suite.json"
          python -c 'import json,sys,yaml; json.dump(yaml.safe_load(open(sys.argv[1], encoding="utf-8")), sys.stdout)' fixtures/benchmarks/core-native/suite-comprehensive.yaml > "$RUNNER_TEMP/comprehensive-benchmark-suite.json"
          python -c 'import json,sys,yaml; json.dump(yaml.safe_load(open(sys.argv[1], encoding="utf-8")), sys.stdout)' fixtures/adapters/fixture-suite.yaml > "$RUNNER_TEMP/adapter-fixture-suite.json"
          python -c 'import json,sys,yaml; json.dump(yaml.safe_load(open(sys.argv[1], encoding="utf-8")), sys.stdout)' packs/core-foundation.yaml > "$RUNNER_TEMP/pack.json"
          python -c 'import json,sys,yaml; json.dump(yaml.safe_load(open(sys.argv[1], encoding="utf-8")), sys.stdout)' packs/core-native.yaml > "$RUNNER_TEMP/core-native-pack.json"
          python scripts/validate_instance.py doctor.schema.json "$RUNNER_TEMP/doctor.json"
          python scripts/validate_instance.py project-config.schema.json "$RUNNER_TEMP/config.json"
          python scripts/validate_instance.py catalog-manifest.schema.json "$RUNNER_TEMP/catalog-manifest.json"
          python scripts/validate_instance.py catalog-bundle.schema.json "$RUNNER_TEMP/catalog-bundle.json"
          python scripts/validate_instance.py benchmark-suite.schema.json "$RUNNER_TEMP/benchmark-suite.json"
          python scripts/validate_instance.py benchmark-report.schema.json "$RUNNER_TEMP/benchmark-report.json"
          python scripts/validate_instance.py benchmark-suite.schema.json "$RUNNER_TEMP/comprehensive-benchmark-suite.json"
          python scripts/validate_instance.py benchmark-report.schema.json "$RUNNER_TEMP/comprehensive-benchmark-report.json"
          python scripts/validate_instance.py adapter-fixture-suite.schema.json "$RUNNER_TEMP/adapter-fixture-suite.json"
          python scripts/validate_instance.py adapter-fixture-report.schema.json "$RUNNER_TEMP/adapter-fixture-report.json"
          python scripts/validate_instance.py pack.schema.json "$RUNNER_TEMP/pack.json"
          python scripts/validate_instance.py pack-report.schema.json "$RUNNER_TEMP/pack-report.json"
          python scripts/validate_instance.py pack.schema.json "$RUNNER_TEMP/core-native-pack.json"
          python scripts/validate_instance.py pack-report.schema.json "$RUNNER_TEMP/core-native-pack-report.json"
          python scripts/validate_instance.py inventory.schema.json "$RUNNER_TEMP/inventory.json"
          python scripts/validate_instance.py plan.schema.json "$RUNNER_TEMP/plan.json"
          python scripts/validate_instance.py run-result.schema.json "$RUNNER_TEMP/run.json"
          python scripts/validate_instance.py plan.schema.json "$RUNNER_TEMP/api-plan.json"
          python scripts/validate_instance.py run-result.schema.json "$RUNNER_TEMP/api-run.json"
          python scripts/validate_instance.py plan.schema.json "$RUNNER_TEMP/kubernetes-plan.json"
          python scripts/validate_instance.py run-result.schema.json "$RUNNER_TEMP/kubernetes-run.json"
          python scripts/validate_instance.py inventory.schema.json "$RUNNER_TEMP/configured-inventory.json"
          python scripts/validate_instance.py plan.schema.json "$RUNNER_TEMP/configured-plan.json"
          python scripts/validate_instance.py run-result.schema.json "$RUNNER_TEMP/configured-run.json"
          python scripts/validate_instance.py history.schema.json "$RUNNER_TEMP/history.json"
          python scripts/validate_instance.py state-check.schema.json "$RUNNER_TEMP/state-check.json"
          python scripts/validate_instance.py run-result.schema.json "$RUNNER_TEMP/historical-run.json"
          python scripts/validate_instance.py invalidation.schema.json "$RUNNER_TEMP/invalidation.json"
          python scripts/validate_instance.py agent-task.schema.json "$RUNNER_TEMP/configured-provider-task.json"
          python scripts/validate_instance.py remediation-candidate.schema.json "$RUNNER_TEMP/remediation.json"
          python scripts/validate_instance.py remediation-candidate.schema.json "$RUNNER_TEMP/mode-remediation.json"
          python scripts/validate_instance.py remediation-candidate.schema.json "$RUNNER_TEMP/configured-remediation.json"
          python scripts/validate_instance.py remediation-candidate.schema.json "$RUNNER_TEMP/provider-remediation.json"
          python scripts/validate_instance.py remediation-run.schema.json "$RUNNER_TEMP/remediation-run.json"

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.lock.txt

      - name: Build documentation
        run: mkdocs build --strict

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for packaged-launcher verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install schema validation dependencies
        run: pip install -r requirements-dev.lock.txt

      - name: Generate deterministic CycloneDX SBOM input
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            mod -json -noserial -notimestamp -short-purls \
            -output "$RUNNER_TEMP/prc.cdx.json" .

      - name: Rebuild all release targets reproducibly
        shell: bash
        run: |
          set -euo pipefail
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          built_at=$(date -u -d "@$source_epoch" +%Y-%m-%dT%H:%M:%SZ)
          for output in release-first release-second; do
            python scripts/build_release.py \
              --version 0.0.0-ci \
              --commit "$GITHUB_SHA" \
              --built-at "$built_at" \
              --sbom "$RUNNER_TEMP/prc.cdx.json" \
              --output "$RUNNER_TEMP/$output"
          done
          diff --recursive --no-dereference \
            "$RUNNER_TEMP/release-first" "$RUNNER_TEMP/release-second"

      - name: Verify release contracts and identity
        run: |
          python scripts/validate_instance.py \
            release-manifest.schema.json \
            "$RUNNER_TEMP/release-first/prc_0.0.0-ci_release-manifest.json"
          mkdir "$RUNNER_TEMP/release-smoke"
          tar -xzf "$RUNNER_TEMP/release-first/prc_0.0.0-ci_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP/release-smoke"
          release_root="$RUNNER_TEMP/release-smoke/prc_0.0.0-ci_linux_amd64"
          "$release_root/prc" \
            version --format json > "$RUNNER_TEMP/release-version.json"
          python scripts/validate_instance.py \
            version.schema.json "$RUNNER_TEMP/release-version.json"
          "$release_root/prc" scan \
            --target . \
            --catalog-root "$release_root" \
            --format json \
            --exit-policy never \
            > "$RUNNER_TEMP/release-first/prc_0.0.0-ci_self-scan.json"
          python scripts/validate_instance.py run-result.schema.json \
            "$RUNNER_TEMP/release-first/prc_0.0.0-ci_self-scan.json"
          python -c 'import json,os,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["inventory"]["git_commit"]==os.environ["GITHUB_SHA"] and d["plan"]["target_commit"]==os.environ["GITHUB_SHA"] and len(d["results"])>0' \
            "$RUNNER_TEMP/release-first/prc_0.0.0-ci_self-scan.json"
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm install --ignore-scripts --offline --no-audit --no-fund --package-lock=false \
            "$RUNNER_TEMP/release-first/marinjursic-prc-linux-x64-0.0.0-ci.tgz" \
            "$RUNNER_TEMP/release-first/marinjursic-prc-0.0.0-ci.tgz"
          ./node_modules/.bin/prc version --format json > "$RUNNER_TEMP/npm-version.json"
          cd "$GITHUB_WORKSPACE"
          python scripts/validate_instance.py version.schema.json "$RUNNER_TEMP/npm-version.json"
          python -c 'import pathlib,sys; from scripts.build_release import write_checksums; write_checksums(pathlib.Path(sys.argv[1]))' \
            "$RUNNER_TEMP/release-first"
          (cd "$RUNNER_TEMP/release-first" && sha256sum --check SHA256SUMS)
