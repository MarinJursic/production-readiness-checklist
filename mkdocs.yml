site_name: Production Readiness Checklist
site_description: 10,042 evidence-driven controls for engineering and shipping software with confidence.
site_author: Production Readiness Checklist contributors
site_url: https://marinjursic.github.io/production-readiness-checklist/
repo_url: https://github.com/MarinJursic/production-readiness-checklist
repo_name: GitHub
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode

nav:
  - Home: index.md
  - Get started:
      - 15-minute quick start: guides/getting-started.md
      - Complete engineering review: engineering/00-overview.md
      - AI-assisted review: guides/ai-assisted-review.md
  - Scanner architecture:
      - Scanner quick start: scanner/getting-started.md
      - CLI and exit codes: scanner/cli-contract.md
      - Scanner diagnostics: scanner/doctor.md
      - Read-only MCP agent integration: scanner/mcp-agent-integration.md
      - Benchmarks and quality budgets: scanner/benchmarks.md
      - Private-key armor inspection: scanner/private-key-armor.md
      - Go HTTP timeout analysis: scanner/go-http-timeouts.md
      - OpenAPI contract analysis: scanner/openapi-contracts.md
      - Project configuration: scanner/configuration.md
      - Durable state and history: scanner/state-and-history.md
      - Signed risk exceptions: scanner/risk-exceptions.md
      - Diff and evidence invalidation: scanner/diff-and-invalidation.md
      - Bounded R1 remediation: scanner/remediation.md
      - Product contract: architecture/product-contract.md
      - Trust and threat model: architecture/trust-model.md
      - Catalog integrity: architecture/catalog-integrity.md
      - Execution plans and capability policy: architecture/execution-plans.md
      - Sandboxed adapters: architecture/adapters.md
      - Offline publisher trust: architecture/publisher-trust.md
      - Read-only agent providers: architecture/agent-providers.md
      - Bounded applicability: architecture/applicability.md
      - Evidence and results: architecture/evidence-and-results.md
      - Bounded remediation: architecture/remediation-contract.md
      - Core repository profile: scanner/core-repository.md
  - Engineering lifecycle:
      - Overview: engineering/00-overview.md
      - 1. Governance and foundations: engineering/01-governance-and-foundations.md
      - 2. Product and requirements: engineering/02-product-and-requirements.md
      - 3. User experience, web, and content: engineering/03-user-experience-web-and-content.md
      - 4. Architecture and design: engineering/04-architecture-and-design.md
      - 5. Code quality and implementation: engineering/05-code-quality-and-implementation.md
      - 6. Application services and APIs: engineering/06-application-services-and-apis.md
      - 7. Data and information lifecycle: engineering/07-data-and-information-lifecycle.md
      - 8. Security and cryptography: engineering/08-security-and-cryptography.md
      - 9. Privacy and data protection: engineering/09-privacy-and-data-protection.md
      - 10. Verification and testing: engineering/10-verification-and-testing.md
      - 11. Developer experience, platform, and delivery: engineering/11-developer-experience-platform-and-delivery.md
      - 12. Operations, SRE, and support: engineering/12-operations-sre-and-support.md
      - 13. Documentation and knowledge: engineering/13-documentation-and-knowledge.md
      - 14. Trust, safety, and ecosystems: engineering/14-trust-safety-and-ecosystems.md
      - 15. AI, ML, and AI-assisted development: engineering/15-ai-ml-and-ai-assisted-development.md
      - 16. Specialized domains and release assurance: engineering/16-specialized-domains-and-release-assurance.md
  - Production release:
      - Readiness principle: checklists/00-readiness-principle.md
      - Release foundations: checklists/01-release-foundations.md
      - Product, risk, and architecture: checklists/02-product-risk-architecture.md
      - Source, build, and supply chain: checklists/03-source-build-supply-chain.md
      - Environments, quality, and experience: checklists/04-environments-quality-experience.md
      - Application security: checklists/05-application-security.md
      - Data, privacy, and performance: checklists/06-data-privacy-performance.md
      - Reliability and operations: checklists/07-reliability-operations.md
      - Maintenance, vendors, and compliance: checklists/08-maintenance-vendors-compliance.md
      - Conditional feature modules: checklists/09-conditional-modules.md
      - Evidence, sign-off, and decision: checklists/10-evidence-and-decision.md
  - Resources:
      - Full AI review: prompts/full-readiness-review.md
      - Release-diff review: prompts/release-diff-review.md
      - Evidence challenge: prompts/evidence-challenge.md
      - Release assessment: records/release-assessment.md
      - Evidence record: records/evidence-record.md
      - Risk exception: records/risk-exception.md
      - Go/no-go decision: records/go-no-go-decision.md
      - Source consolidation manifest: engineering/source-manifest.md
      - References and scope: references.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MarinJursic/production-readiness-checklist
      name: Production Readiness Checklist on GitHub

